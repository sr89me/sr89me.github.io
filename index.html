<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quyên Góp Cá Nhân</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #0070ba; }
        p { line-height: 1.6; color: #555; }
        .donate-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Chào mừng bạn đến với dự án của tôi!</h1>
        <p>Cảm ơn bạn đã ghé thăm. Dự án này được duy trì hoàn toàn miễn phí. Nếu bạn thấy nó hữu ích và muốn ủng hộ tôi một cốc cà phê để tiếp tục phát triển, bạn có thể quyên góp qua PayPal ở bên dưới.</p>
        
        <div class="donate-section">
            <!-- DÁN MÃ HTML CỦA PAYPAL VÀO DƯỚI ĐÂY -->
            
            <form action="https://www.paypal.com/donate" method="post" target="_top">
                <input type="hidden" name="business" value="EMAIL_PAYPAL_CUA_BAN@gmail.com" />
                <input type="hidden" name="currency_code" value="USD" />
                <input type="image" src="https://www.paypalobjects.com/en_US/i/btn/btn_donateCC_LG.gif" border="0" name="submit" title="PayPal - The safer, easier way to pay online!" alt="Donate with PayPal button" />
                <img alt="" border="0" src="https://www.paypal.com/en_US/i/scr/pixel.gif" width="1" height="1" />
            </form>

            <!-- KẾT THÚC MÃ PAYPAL -->
        </div>
    </div>

</body>
</html>
